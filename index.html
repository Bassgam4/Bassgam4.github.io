<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca</title>

<style>
  body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
  }

  h2 {
    margin-top: 20px;
  }

  .container {
    width: 90%;
    margin: auto;
    margin-top: 20px;
  }

  input {
    padding: 10px;
    width: 250px;
    border-radius: 8px;
    border: none;
    margin-right: 10px;
  }

  button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    margin: 5px;
  }

  button:hover {
    background: #2563eb;
  }

  table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
  }

  th {
    background: #334155;
  }

  tr:nth-child(even) {
    background: #1e293b;
  }

  tr:nth-child(odd) {
    background: #0f172a;
  }

</style>
</head>

<body>

<h2>Biblioteca Ajuchitlancito</h2>

<div class="container">

  <!-- 🔍 Buscador -->
  <input type="text" id="busqueda" placeholder="Buscar libro...">
  <button onclick="buscar()">Buscar</button>
  <button onclick="reset()">Reset</button>

  <!-- 📊 Tabla -->
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Autor</th>
        <th>Título</th>
        <th>Clasificación</th>
      </tr>
    </thead>
    <tbody id="tablaLibros"></tbody>
  </table>

  <!-- 🔄 Paginación -->
  <div>
    <button onclick="anterior()">Anterior</button>
    <button onclick="siguiente()">Siguiente</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMquvNT9DeRw55Bi0C_shiH399GR8IWEE",
  authDomain: "biblioteca-556de.firebaseapp.com",
  databaseURL: "https://biblioteca-556de-default-rtdb.firebaseio.com",
  projectId: "biblioteca-556de",
  storageBucket: "biblioteca-556de.firebasestorage.app",
  messagingSenderId: "600663910838",
  appId: "1:600663910838:web:fa565071e582584532b917"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let libros = [];
let filtrados = [];
let pagina = 0;
const limite = 15;

// 🔹 Cargar datos
async function cargarLibros() {
  const snapshot = await get(ref(db, "libros"));
  if (snapshot.exists()) {
    libros = Object.values(snapshot.val());
    filtrados = libros;
    render();
  }
}

// 🔹 Renderizar (REEMPLAZA contenido)
function render() {
  const tabla = document.getElementById("tablaLibros");
  tabla.innerHTML = "";

  const inicio = pagina * limite;
  const fin = inicio + limite;

  filtrados.slice(inicio, fin).forEach(libro => {
    tabla.innerHTML += `
      <tr>
        <td>${libro.no}</td>
        <td>${libro.autor}</td>
        <td>${libro.título}</td>
        <td>${libro.clasificación}</td>
      </tr>
    `;
  });
}

// 🔹 Paginación
window.siguiente = function() {
  if ((pagina + 1) * limite < filtrados.length) {
    pagina++;
    render();
  }
};

window.anterior = function() {
  if (pagina > 0) {
    pagina--;
    render();
  }
};

// 🔍 Buscar
window.buscar = function() {
  const texto = document.getElementById("busqueda").value.toLowerCase().trim();
  pagina = 0;

  filtrados = libros.filter(libro => {
    return (
      String(libro.no || "").toLowerCase().includes(texto) ||
      String(libro.nt || "").toLowerCase().includes(texto) ||
      String(libro.autor || "").toLowerCase().includes(texto) ||
      String(libro.título || "").toLowerCase().includes(texto) ||
      String(libro.clasificación || "").toLowerCase().includes(texto)
    );
  });

  render();
};

// 🔄 Reset
window.reset = function() {
  document.getElementById("busqueda").value = "";
  filtrados = libros;
  pagina = 0;
  render();
};

// 🚀 Inicio
cargarLibros();

</script>

</body>
</html>
